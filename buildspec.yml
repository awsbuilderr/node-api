version: 0.2

phases:
pre_build:
  commands:
    - echo "Logging in to Amazon ECR..."
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URL
    - IMAGE_TAG="v${CODEBUILD_BUILD_NUMBER}"
    - echo "Image Tag: $IMAGE_TAG"
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...

      - docker build -t $ECR_REPOSITORY_URL:latest .

      - docker tag $ECR_REPOSITORY_URL:latest $ECR_REPOSITORY_URL:$IMAGE_TAG

  post_build:
    commands:
      - echo Build completed on `date`

      - echo Pushing latest image...
      - docker push $ECR_REPOSITORY_URL:latest

      - echo Pushing versioned image...
      - docker push $ECR_REPOSITORY_URL:$IMAGE_TAG

      - echo Writing image definitions...
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$ECR_REPOSITORY_URL:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
